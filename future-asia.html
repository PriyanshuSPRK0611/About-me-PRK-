<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction · Apple Inspired</title>
    <style>
        /* Apple-inspired black / white / grey theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f5f5f7;
            line-height: 1.5;
            padding: 1.5rem;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* main glass-like container with subtle depth */
        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 48px;
            padding: 4.5rem 3rem;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            text-align: center;
            transition: all 0.4s ease;
        }

        /* subtle breathing animation on the card */
        .card {
            animation: softGlow 6s infinite alternate ease-in-out;
        }

        @keyframes softGlow {
            0% {
                box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
                border-color: rgba(255, 255, 255, 0.06);
            }
            100% {
                box-shadow: 0 40px 80px -18px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
                border-color: rgba(255, 255, 255, 0.18);
            }
        }

        /* main title — minimalist, thin, large */
        h1 {
            font-size: clamp(2.4rem, 9vw, 4.2rem);
            font-weight: 300;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 0.5rem;
            opacity: 0;
            animation: fadeUp 0.9s 0.1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        /* subtle divider line (apple style) */
        .divider {
            width: 80px;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            margin: 1.8rem auto 2.5rem;
            border-radius: 100px;
            opacity: 0;
            animation: fadeUp 0.8s 0.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        /* "we will come back soon" line */
        .subhead {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 300;
            color: #c0c0c8;
            letter-spacing: -0.01em;
            margin-bottom: 3.5rem;
            opacity: 0;
            animation: fadeUp 0.9s 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        /* the big tech brand lines container — clean & monochrome */
        .tech-lines {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin: 2.5rem 0 3rem;
        }

        .tech-item {
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            font-weight: 300;
            color: #a1a1aa;
            letter-spacing: -0.01em;
            opacity: 0;
            transform: translateY(8px);
            animation: fadeUp 0.7s forwards cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        /* staggered animation delays */
        .tech-item:nth-child(1) { animation-delay: 0.5s; }
        .tech-item:nth-child(2) { animation-delay: 0.7s; }
        .tech-item:nth-child(3) { animation-delay: 0.9s; }
        .tech-item:nth-child(4) { animation-delay: 1.1s; }
        .tech-item:nth-child(5) { animation-delay: 1.3s; }

        /* subtle micro interaction for each line */
        .tech-item span {
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-block;
        }

        .tech-item:hover span {
            color: #ffffff;
            transform: scale(1.02);
        }

        /* small square bullets — like apple's quiet design */
        .tech-item::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #6e6e73;
            border-radius: 1px;
            margin-right: 12px;
            transition: background 0.3s ease, transform 0.3s ease;
            flex-shrink: 0;
        }

        .tech-item:hover::before {
            background: #ffffff;
            transform: rotate(45deg);
        }

        /* bottom note — extremely subtle */
        .footnote {
            margin-top: 3.5rem;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.03em;
            color: #6e6e73;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 1s 1.7s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 2rem;
        }

        /* keyframes */
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* fine-tune mobile */
        @media (max-width: 600px) {
            .card {
                padding: 3rem 1.5rem;
                border-radius: 32px;
            }
            .tech-item {
                font-size: 0.95rem;
            }
            .divider {
                margin: 1.5rem auto 2rem;
            }
        }

        /* reduce motion if requested */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .card {
                animation: none;
                box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Under Construction</h1>
        <div class="divider"></div>
        <div class="subhead">We will come back soon.</div>

        <!-- big tech brands in their 'under construction' phase — apple style monochrome -->
        <div class="tech-lines">
            <div class="tech-item"><span>Apple · under construction</span></div>
            <div class="tech-item"><span>Google · under construction</span></div>
            <div class="tech-item"><span>Microsoft · under construction</span></div>
            <div class="tech-item"><span>Amazon · under construction</span></div>
            <div class="tech-item"><span>Meta · under construction</span></div>
        </div>

        <div class="footnote">Precision · minimal · coming back</div>
    </div>
</body>
</html>
