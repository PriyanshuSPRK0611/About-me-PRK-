<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Arial, sans-serif;
      background: #050505;
    }

    body::before {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, #555, transparent 65%);
      filter: blur(45px);
      animation: float 8s ease-in-out infinite alternate;
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(90%, 680px);
      padding: 70px 30px;
      text-align: center;
      border: 1px solid #333;
      border-radius: 28px;
      background: rgba(20, 20, 20, 0.65);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px #000;
      animation: appear 1.2s ease forwards;
    }

    .logo {
      width: 42px;
      height: 52px;
      margin: 0 auto 32px;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(135deg, #fff, #777);
      transform: rotate(-12deg);
      box-shadow: 0 0 35px #888;
    }

    .logo::after {
      content: "";
      display: block;
      width: 17px;
      height: 10px;
      margin: -5px 0 0 28px;
      border-radius: 100% 0;
      background: #aaa;
      transform: rotate(-25deg);
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: -0.06em;
      margin-bottom: 18px;
    }

    p {
      color: #aaa;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .line {
      width: 70px;
      height: 3px;
      margin: 28px auto 0;
      border-radius: 10px;
      background: #fff;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(30px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      from { transform: translate(-120px, -80px) scale(.8); }
      to { transform: translate(150px, 100px) scale(1.2); }
    }

    @keyframes pulse {
      0%, 100% { width: 35px; opacity: .4; }
      50% { width: 110px; opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo"></div>
    <h1>Under Construction</h1>
    <p>We’re creating something remarkable.<br />We’ll be back soon.</p>
    <div class="line"></div>
  </main>
</body>
</html>
