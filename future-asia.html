<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Under Construction</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000; /* Black background */
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      color: #f5f5f7; /* Apple-style off-white text */
      text-align: center;
    }
    .container {
      background-color: #1c1c1e; /* Dark grey panel */
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    p {
      font-size: 1.2rem;
      color: #d1d1d1; /* Subtle grey text */
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Page Under Construction</h1>
    <p>We will be back soon with something new.</p>
  </div>
</body>
</html>
