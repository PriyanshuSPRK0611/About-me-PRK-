<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">

  <title>PRK — Admin Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./admin.css">
</head>

<body>

  <!-- =========================
       LOGIN SCREEN
  ========================== -->

  <main id="loginScreen" class="login-screen">

    <div class="login-box">

      <p class="eyebrow">PRK · PRIVATE</p>

      <h1>
        Admin<br>
        <span>Dashboard.</span>
      </h1>

      <p class="login-description">
        Sign in to manage your website.
      </p>

      <form id="loginForm" class="login-form">

        <div class="form-field">
          <label for="loginEmail">EMAIL</label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-field">
          <label for="loginPassword">PASSWORD</label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="login-submit">
          <span>Sign In</span>
          <span>↗</span>
        </button>

        <p id="loginStatus" class="login-status"></p>

      </form>

    </div>

  </main>


  <!-- =========================
       DASHBOARD
  ========================== -->

  <div id="dashboardScreen" class="dashboard-screen" hidden>

    <header class="admin-header">

      <div>
        <p class="eyebrow">PRK · ADMIN</p>
        <h1>Dashboard</h1>
      </div>

      <div class="header-actions">

        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
        >
          ☾
        </button>

        <button
          id="logoutBtn"
          class="logout-btn"
          type="button"
        >
          Logout
        </button>

      </div>

    </header>


    <main class="dashboard">

      <!-- STATS -->

      <section class="stats-grid">

        <div class="stat-card">
          <span>TOTAL SUBMISSIONS</span>
          <strong id="totalSubmissions">0</strong>
        </div>

        <div class="stat-card">
          <span>LATEST SUBMISSION</span>
          <strong id="latestSubmission">—</strong>
        </div>

      </section>


      <!-- SUBMISSIONS -->

      <section class="submissions-section">

        <div class="section-heading">

          <div>
            <p class="eyebrow">JOIN US</p>
            <h2>Submissions</h2>
          </div>

          <button
            id="refreshBtn"
            class="refresh-btn"
            type="button"
          >
            Refresh ↻
          </button>

        </div>

        <div
          id="submissionsList"
          class="submissions-list"
        >
          <div class="empty-state">
            Loading submissions...
          </div>
        </div>

      </section>

    </main>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./admin.js"></script>

</body>
</html>
