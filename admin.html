<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">

  <title>PRK — Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./admin.css">
</head>

<body>

  <!-- LOGIN -->

  <section id="loginScreen" class="login-screen">

    <div class="login-container">

      <p class="eyebrow">PRK · PRIVATE</p>

      <h1>
        Admin<br>
        <span>Dashboard.</span>
      </h1>

      <p class="description">
        Sign in to manage your PRK website.
      </p>

      <form id="loginForm">

        <label for="email">EMAIL</label>
        <input
          id="email"
          type="email"
          placeholder="Your email"
          autocomplete="email"
          required
        >

        <label for="password">PASSWORD</label>
        <input
          id="password"
          type="password"
          placeholder="Your password"
          autocomplete="current-password"
          required
        >

        <button type="submit">
          <span>Sign In</span>
          <span>↗</span>
        </button>

        <p id="loginMessage"></p>

      </form>

    </div>

  </section>


  <!-- DASHBOARD -->

  <section id="dashboardScreen" class="dashboard-screen" hidden>

    <header>

      <div>
        <p class="eyebrow">PRK · ADMIN</p>
        <h2>Dashboard</h2>
      </div>

      <button id="logoutButton">
        Logout
      </button>

    </header>


    <main>

      <div class="stats">

        <div class="stat">
          <span>TOTAL SUBMISSIONS</span>
          <strong id="total">0</strong>
        </div>

        <div class="stat">
          <span>STATUS</span>
          <strong>ACTIVE</strong>
        </div>

      </div>


      <div class="heading">

        <div>
          <p class="eyebrow">JOIN US</p>
          <h3>Submissions</h3>
        </div>

        <button id="refreshButton">
          Refresh ↻
        </button>

      </div>


      <div id="submissions">
        <p class="loading">
          Loading submissions...
        </p>
      </div>

    </main>

  </section>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./admin.js"></script>

</body>
</html>
